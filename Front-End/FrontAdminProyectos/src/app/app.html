<div
  class="app-container"
  [class.with-sidebar]="showSidebar"
  [class.mobile-open]="sidebarMobileOpen"
>
  <!-- BOTÓN HAMBURGUESA FLOTANTE PARA MÓVIL -->
  <button
    *ngIf="showSidebar"
    type="button"
    class="mobile-hamburger-btn"
    (click)="toggleSidebarMobile()"
    [attr.aria-label]="sidebarMobileOpen ? 'Cerrar menú' : 'Abrir menú'"
    [title]="sidebarMobileOpen ? 'Cerrar menú' : 'Abrir menú'"
  >
    <svg
      *ngIf="!sidebarMobileOpen"
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <line x1="3" y1="12" x2="21" y2="12"></line>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
    <svg
      *ngIf="sidebarMobileOpen"
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>

  <!-- OVERLAY / TELÓN PARA CERRAR EL MENÚ EN MÓVIL AL TOCAR FUERA -->
  <div
    class="sidebar-mobile-backdrop"
    *ngIf="showSidebar && sidebarMobileOpen"
    (click)="cerrarSidebarMobile()"
  ></div>

  <!-- SIDEBAR -->
  <app-sidebar
    *ngIf="showSidebar"
  ></app-sidebar>

  <main class="app-main">
    <app-navbar-proyecto></app-navbar-proyecto>

    <div class="app-page">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<app-chat-widget></app-chat-widget>

<app-confirmacion-modal>
</app-confirmacion-modal>
