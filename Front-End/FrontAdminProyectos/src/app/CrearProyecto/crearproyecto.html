<div class="crear-proyecto-container">
  <main class="main-content">
    
    <div class="header-simple">
      <button (click)="cancelar()" class="btn-volver">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Volver
      </button>
      <h1>Crear Nuevo Proyecto</h1>
    </div>

    <div class="crear-proyecto-card">
      <form (ngSubmit)="onSubmit()" #proyectoForm="ngForm">
        
        <!-- SECCIÓN 1: DATOS DEL PROYECTO -->
        <div class="card-header">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
          <h3>Configuración Inicial</h3>
        </div>
        
        <div class="form-group">
          <label for="nombre">Nombre del Proyecto <span class="required">*</span></label>
          <input 
            type="text" 
            id="nombre"
            [(ngModel)]="proyecto.nombre" 
            name="nombre"
            required
            class="k-input"
            placeholder="Ej. Diseño de Interfaz Orbita"
          >
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción</label>
          <textarea 
            id="descripcion"
            [(ngModel)]="proyecto.descripcion" 
            name="descripcion"
            class="k-input"
            placeholder="Describe brevemente los objetivos del proyecto..."
            rows="3"
          ></textarea>
        </div>

        <!-- SECCIÓN 2: COLABORADORES INICIALES -->
        <div class="card-header" style="margin-top: 32px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          <h3>Colaboradores del Proyecto</h3>
        </div>

        <div class="agregar-integrante">
          <input 
            type="email" 
            [(ngModel)]="nuevoColaborador.correo" 
            name="nuevoCorreo" 
            class="k-input input-correo" 
            placeholder="Correo electrónico del colaborador"
          >
          <select [(ngModel)]="nuevoColaborador.rol" name="nuevoRol" class="k-input select-rol">
            <option value="colaborador">Colaborador</option>
            <option value="admin">Administrador</option>
          </select>
          <button type="button" class="btn btn-primary btn-agregar" (click)="agregarColaboradorLista()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Agregar
          </button>
        </div>

        <!-- Lista de colaboradores a invitar -->
        <div class="lista-integrantes" *ngIf="colaboradoresPendientes.length > 0">
          <div class="integrante-item" *ngFor="let colab of colaboradoresPendientes; let i = index">
            <div class="integrante-info">
              <div class="avatar-circle">{{ colab.correo.charAt(0).toUpperCase() }}</div>
              <div class="detalles">
                <span class="nombre">{{ colab.correo }}</span>
                <span class="email">Invitación pendiente</span>
              </div>
            </div>
            <div class="integrante-actions">
               <span class="badge-rol">{{ colab.rol === 'admin' ? 'Administrador' : 'Colaborador' }}</span>
               <button type="button" class="btn-icon btn-eliminar" (click)="removerColaboradorLista(i)" title="Eliminar de la lista">
                 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
               </button>
            </div>
          </div>
        </div>

        <!-- ALERTAS Y BOTONES FINALES -->
        <div *ngIf="errorMessage" class="alert error-message" style="margin-top: 24px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          {{ errorMessage }}
        </div>

        <div *ngIf="successMessage" class="alert success-message" style="margin-top: 24px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          {{ successMessage }}
        </div>

        <div class="form-actions">
          <button type="button" (click)="cancelar()" class="btn btn-ghost">Cancelar</button>
          <button type="submit" [disabled]="cargando || proyectoForm.invalid" class="btn btn-primary">
            {{ cargando ? 'Creando entorno...' : 'Crear Proyecto' }}
          </button>
        </div>
        
      </form>
    </div>
  </main>
</div>
