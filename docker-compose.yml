version: '3.8'

services:
  backend:
    build: ./Back-End  # EJEMPLO: ./backend
    container_name: demo_backend
    ports:
      - "8000:8000"

  frontend:
    build: ./Front-End/FrontAdminProyectos # EJEMPLO: ./frontend
    container_name: demo_frontend
    ports:
      - "4200:80" # Conectamos el puerto 4200 de tu PC al Nginx de Docker
    depends_on:
      - backend